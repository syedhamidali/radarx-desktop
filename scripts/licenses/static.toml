attribution = "Copyright ECMWF. LICENSE and NOTICE ship in the wheels. The Python wheels bundle the C libraries ecCodes, eckit and their own dependencies."
url = "https://github.com/ecmwf/eccodes-python"

# ---------------------------------------------------------------- optional components (downloaded on request)
# The movie components pack (scripts/release/build_movie_pack.py, engine/movie_pack.py): NOT in the installers.
# The installed app offers it in the Movie Studio with a consent card (what, from where, how big, licences) and
# keeps it in the user's data folder; the licence texts of every component travel inside the pack (licenses/).
# No video library is in it: the film is encoded by Chrome itself (see the vendored muxers above). PyAV, whose
