# Entries that package metadata cannot give: fonts, colour maps, map/terrain/imagery services, data and the
# native libraries inside binary wheels. Read by generate_notices.py. Statements here come from the upstream
# projects' published terms as understood by the maintainer; they are NOT legal advice and are to be reviewed
# by a lawyer. An entry with `flag` is repeated in the "Needs attention" table of THIRD_PARTY_NOTICES.md.
#
# fields: kind (font|colormap|imagery|data|native), name, license, where, attribution, url, flag, note

