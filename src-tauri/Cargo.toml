[package]
name = "radarx-desktop"
version = "0.5.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Radarx Desktop by LabShope Technologies"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the termination-signal handling in main.rs (tokio::signal, select!) is used directly.
tokio = { version = "1", features = ["signal", "macros"] }
portpicker = "0.1"
getrandom = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "~2.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "radarx-desktop"
path = "src/main.rs"

# Release builds: smaller and faster. panic = "abort" is deliberately NOT set: the panic hook in
# main.rs only stops the Python sidecar for a main-thread panic, and a panic on another thread must
# keep unwinding (instead of aborting the app and orphaning the sidecar).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
