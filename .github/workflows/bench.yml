name: Benchmark check

# Optional and never blocking: it runs only when asked (the "bench" label on a pull request, or
# "Run workflow"), takes a few minutes, and a regression shows up as a failed step of a job that
# is allowed to fail. It compares a handful of timings with python/benchmarks/ci_baseline.json
# after dividing out the speed of the machine (scripts/perf/bench_check.py).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "python/**"
      - "scripts/perf/**"

jobs:
  bench:
    name: Benchmark check (informational)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "python[dev]"

      - name: Compare with the baseline
        # the synthetic volumes need no data and no account; the check starts the engine only
        run: python scripts/perf/bench_check.py --python "$(which python)"
