name: Docs

# Builds the documentation exactly like Read the Docs does (same conda environment, same docs/conf.py).
# Only sources are committed: HTML, the API pages written by conf.py and executed notebook outputs are build
# products (see .gitignore). Notebook outputs, once notebooks exist, are published as a jupyter-cache on the
# orphan branch "docs-cache" by the `publish` job below, and Read the Docs executes only the notebooks whose
# code changed - the same scheme as radarx.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # pull requests check the build when they touch the documentation or the code it documents
  pull_request:
    branches: [ main ]
    paths:
      - "docs/**"
      - "python/engine/**"
      - "python/modules/**"
      - environment.yml
      - .readthedocs.yaml
      - .github/workflows/docs.yml

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    env:
      # start from an empty notebook cache so that every notebook runs on this commit
      XRADAR_DOCS_JUPYTER_CACHE: ${{ github.workspace }}/docs/_build/jupyter_cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the Read the Docs conda environment
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462  # v2.0.7
        with:
          environment-name: radarx-desktop-docs
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-docs-${{hashFiles('environment.yml')}}"
      - name: Install the engine
        run: python -m pip install ./python
      - name: Build the documentation
        working-directory: docs
        run: python -m sphinx -T -b html -d _build/doctrees -w _build/warnings.txt . _build/html
      - name: Show warnings
        if: always()
        run: test -f docs/_build/warnings.txt && cat docs/_build/warnings.txt || true
      - name: Upload the HTML documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
      - name: Pack the notebook outputs
        run: |
          mkdir -p docs/_build/jupyter_cache
          tar -C docs/_build/jupyter_cache -czf jupyter_cache.tar.gz .
      - name: Upload the notebook outputs
        uses: actions/upload-artifact@v4
        with:
          name: jupyter-cache
          path: jupyter_cache.tar.gz
          retention-days: 7

  publish:
    name: publish notebook outputs
    needs: [build]
    # runs on main only; the steps do nothing until notebooks exist in docs/notebooks
    # (then docs-cache is force-pushed as an orphan branch)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notebooks present?
        id: nb
        run: |
          if ls docs/notebooks/*.md >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.nb.outputs.present == 'true'
        with:
          name: jupyter-cache
      - name: Publish on the docs-cache branch
        if: steps.nb.outputs.present == 'true'
        run: |
          mkdir cache && tar -xzf jupyter_cache.tar.gz -C cache
          cd cache
          git init -q -b docs-cache
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: notebook outputs for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" docs-cache
