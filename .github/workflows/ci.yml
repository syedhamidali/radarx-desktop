name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Python: lint + test
  # ---------------------------------------------------------------
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,radarx]"
          pip install ruff pytest-cov open-radar-data

      - name: Ruff check
        run: ruff check --config ../ruff.toml .

      - name: Ruff format check
        run: ruff format --config ../ruff.toml --check .

      # real radar files for the tests come from open-radar-data (see python/tests/radar_data.py);
      # they are downloaded here (and only here) and cached between runs
      - name: Cache test data (open-radar-data)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.test-data
          key: test-data-${{ hashFiles('python/tests/radar_data.py') }}
          restore-keys: test-data-

      - name: Pytest with coverage
        env:
          XRADAR_TEST_DOWNLOAD: "1"
          XRADAR_TEST_DATA_DIR: ${{ github.workspace }}/.test-data
          OPEN_RADAR_DATA_CACHE: ${{ github.workspace }}/.test-data
        run: python -m pytest tests/ -v --tb=short --cov=engine --cov=modules --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          # Codecov requires an upload token (repository secret CODECOV_TOKEN)
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: syedhamidali/xradar-desktop
          files: python/coverage.xml
          flags: python-${{ runner.os }}
          name: python-${{ runner.os }}
          # do not fail the build while the secret is not set yet (forks and PRs from forks have none)
          fail_ci_if_error: false

  # ---------------------------------------------------------------
  # Frontend: svelte-check + TypeScript
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # the unit tests import .ts files directly (Node strips the types)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      # Builds the app bundle (catches build-only errors) and, on the main repo, uploads its size
      # breakdown to Codecov Bundle Analysis. Forks have no token: the plugin is then a no-op.
      - name: Build
        run: npm run build
        env:
          CODECOV_TOKEN: ${{ matrix.os == 'ubuntu-latest' && secrets.CODECOV_TOKEN || '' }}

  # ---------------------------------------------------------------
  # Rust: cargo check + clippy
  # ---------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cargo check
        run: cargo check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings

  # ---------------------------------------------------------------
  # Engine Docker image (the web deployment): builds, starts, answers /health and web_info
  # ---------------------------------------------------------------
  docker:
    name: Engine image (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t xradar-engine python/

      - name: Start it and check it answers
        run: |
          docker run -d --name engine -p 10000:10000 -e XRADAR_ALLOWED_ORIGINS=http://localhost:3000 xradar-engine
          for i in $(seq 1 30); do
            curl -fsS http://localhost:10000/health && break
            sleep 2
          done
          curl -fsS http://localhost:10000/health
          pip install websockets
          python - <<'PY'
          import asyncio, json
          import websockets

          async def main():
              async with websockets.connect(
                  "ws://localhost:10000", additional_headers={"Origin": "http://localhost:3000"}
              ) as ws:
                  info = json.loads(await asyncio.wait_for(ws.recv(), 20))
                  assert info["type"] == "web_info" and info["web_mode"] is True, info
                  print("web_info ok:", info["limits"])

          asyncio.run(main())
          PY

      - name: Engine log (on failure)
        if: failure()
        run: docker logs engine
