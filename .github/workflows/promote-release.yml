name: Promote release

# Publishing a release = running this workflow (docs/RELEASING.md).
#
# It makes a version that the Release workflow uploaded as a candidate (radarx/v<version>/ on the
# download host) the LIVE one: it copies the candidate update manifest to radarx/latest.json (what
# installed apps read) and rebuilds radarx/releases.json (what the website reads). Before writing
# anything it checks the candidate: SHA256SUMS against every file, signatures against the manifest.
# Nothing is ever deleted. Rollback: run it with an OLDER tag and "rollback" ticked.
#
# Needs the repository secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_BUCKET.
# Unlike the upload in release.yml, this workflow FAILS when they are missing: someone asked for a
# release to go live and it cannot.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to make live, e.g. v0.3.0"
        required: true
        type: string
      dry_run:
        description: "Only check the candidate; write nothing"
        required: false
        default: false
        type: boolean
      rollback:
        description: "Go back to this OLDER version (newer ones are withdrawn from the website index)"
        required: false
        default: false
        type: boolean

# Nothing here touches the repository.
permissions:
  contents: read

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs and the secrets
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::The tag must look like v0.3.0 (or v0.3.0-rc.1)."
            exit 1
          fi
          missing=""
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) not set:$missing. See docs/RELEASING.md (owner set-up)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The checks run twice on purpose: first alone (a refusal changes nothing), then for real.
      - name: Check the candidate
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          ROLLBACK: ${{ inputs.rollback }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          args=(promote --tag "$TAG" --dry-run)
          if [ "$ROLLBACK" = "true" ]; then args+=(--rollback); fi
          python scripts/release/promote.py "${args[@]}"

      - name: Promote
        id: promote
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          ROLLBACK: ${{ inputs.rollback }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          args=(promote --tag "$TAG")
          if [ "$ROLLBACK" = "true" ]; then args+=(--rollback); fi
          python scripts/release/promote.py "${args[@]}" | tee promote.log
          {
            echo "### Promoted"
            echo ""
            echo '```'
            cat promote.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # What the apps and the website will see, through the public address (needs the custom domain).
      - name: Check the public address
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          want="${TAG#v}"
          ok=""
          for attempt in 1 2 3 4 5 6; do
            got="$(curl -fsS --max-time 20 https://downloads.labshope.com/radarx/latest.json |
              python -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)"
            if [ "$got" = "$want" ]; then ok=1; break; fi
            echo "attempt $attempt: the public address serves '${got:-nothing}', expected $want"
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "::error::The bucket was updated but https://downloads.labshope.com/radarx/latest.json does not serve $want. Check the custom domain (docs/RELEASING.md)."
            exit 1
          fi
          echo "https://downloads.labshope.com/radarx/latest.json serves $want"
