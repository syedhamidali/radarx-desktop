name: Licenses

# Fails when a shipped dependency (Python engine, npm production dependencies, Rust crates) has an unknown or
# not-allowed licence according to scripts/licenses/allowed.toml, and when THIRD_PARTY_NOTICES.md is out of
# date for the npm, Rust and static sections. See docs/LICENSES.md. This is an engineering check, not legal
# advice.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "python/pyproject.toml"
      - "python/packaging/**"
      - "scripts/licenses/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/licenses.yml"
  # new releases of dependencies change their licences without a commit here
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licenses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the engine (to read the installed package metadata)
        run: |
          python -m pip install --upgrade pip pytest
          pip install -e "python[radarx]"

      - name: Tests of the licence policy logic
        run: python -m pytest scripts/licenses -q

      - name: Check every dependency against the allow-list
        run: python scripts/licenses/generate_notices.py --check

      - name: THIRD_PARTY_NOTICES.md is up to date (npm, Rust, static sections)
        run: python scripts/licenses/generate_notices.py --verify
