name: Release

# Builds the installers (macOS Apple-silicon + Intel, Linux, Windows). Each one ships its own copy of
# the Python engine, so users install nothing else.
#   - push a tag like v0.2.0 to build and attach the installers to a draft GitHub release
#   - or run it by hand (Actions -> Release -> Run workflow) to just get the installers as artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Changes to the packaging itself get a trial build (no release is created).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "python/packaging/**"
      - "src-tauri/tauri.bundle*.json"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            config: src-tauri/tauri.bundle.macos.conf.json
            bundles: app,dmg
          - name: macOS (Intel)
            os: macos-15-intel
            config: src-tauri/tauri.bundle.macos.conf.json
            bundles: app,dmg
          - name: Linux
            os: ubuntu-22.04
            config: src-tauri/tauri.bundle.conf.json
            bundles: deb,rpm
          - name: Windows
            os: windows-latest
            config: src-tauri/tauri.bundle.conf.json
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # radarx (the optional algorithm modules) needs Python >= 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libcairo2-dev pkg-config

      - name: Install engine dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[radarx,bundle,dev]"

      - name: Build the engine (PyInstaller) and smoke-test it
        working-directory: python
        run: python packaging/build_engine.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "xradar desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --config ${{ matrix.config }} --bundles ${{ matrix.bundles }}

      - name: Keep the installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
