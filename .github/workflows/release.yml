name: Release

# Builds the installers (macOS Apple-silicon + Intel, Linux, Windows). Each one ships its own copy of
# the Python engine, so users install nothing else.
#   - push a tag like v0.2.0 to build and attach the installers to a draft GitHub release
#   - or run it by hand (Actions -> Release -> Run workflow) to just get the installers as artifacts
#
# Self-update (docs/UPDATES.md): when the repository secret TAURI_SIGNING_PRIVATE_KEY exists, tag and
# manual builds also create and sign the updater artifacts, and tauri-action publishes latest.json next
# to the installers. Without the secret (forks, or before the key is set up) and on pull requests the
# build is the same as before, just unsigned: it never fails because a secret is missing.
#
# Download channel (docs/RELEASING.md): on a tag build the `downloads` job copies the draft release's
# files to the download host (Cloudflare R2) as a CANDIDATE under radarx/v<version>/. It is additive:
# the draft GitHub release is created exactly as before, and without the R2 secrets the job only
# prints a notice. Nothing goes live until the "Promote release" workflow is run for the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Changes to the packaging itself get a trial build (no release is created).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "python/packaging/**"
      - "src-tauri/tauri.bundle*.json"

# Creating the GitHub release (and uploading the installers to it) needs write access to contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            config: src-tauri/tauri.bundle.macos.conf.json
            # "app" is what the updater downloads (.app.tar.gz); the dmg is the first-install download.
            bundles: app,dmg
            updater: true
          - name: macOS (Intel)
            os: macos-15-intel
            config: src-tauri/tauri.bundle.macos.conf.json
            bundles: app,dmg
            updater: true
          - name: Linux
            os: ubuntu-22.04
            config: src-tauri/tauri.bundle.conf.json
            bundles: deb,rpm
            # deb / rpm are not updater targets (tauri-bundler cannot sign them, and asking for updater
            # artifacts with only those targets is an error). Linux installs are told about new versions
            # and linked to the release page instead.
            updater: false
          - name: Windows
            os: windows-latest
            config: src-tauri/tauri.bundle.conf.json
            bundles: nsis
            updater: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # radarx (the optional algorithm modules) needs Python >= 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install engine dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[radarx,bundle,dev]"

      - name: Build the engine (PyInstaller) and smoke-test it
        working-directory: python
        run: python packaging/build_engine.py

      - name: Install frontend dependencies
        run: npm ci

      # Release notes shown in the app's update dialog come from the tag message
      # (git tag -a v0.3.0 -m "..."), because tauri-action copies the release body into latest.json.
      - name: Release notes from the tag message
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # actions/checkout turns an annotated tag into a plain pointer to its commit (the message
          # is lost, %(contents) would give the commit message), so fetch the tag object itself.
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          body="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' | head -c 15000)"
          [ -n "$body" ] || body="See the release page for details."
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$body"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Sign the updater artifacts only when the private key is available (never on pull requests, and
      # not on forks, where secrets are empty). Secrets cannot be tested in `if:`, so test them here.
      - name: Decide whether to sign the updater artifacts
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          EVENT: ${{ github.event_name }}
          UPDATER: ${{ matrix.updater }}
        run: |
          if [ "$EVENT" != "pull_request" ] && [ "$UPDATER" = "true" ] && [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "Updater artifacts will be created and signed."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Updater artifacts are skipped (pull request, Linux package, or no TAURI_SIGNING_PRIVATE_KEY secret)."
            if [ "$EVENT" = "push" ] && [ "$UPDATER" = "true" ] && [ -z "$KEY" ]; then
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this release will have no latest.json and installed apps will not be offered updates. See docs/UPDATES.md."
            fi
          fi
          if [ "$EVENT" = "push" ] && grep -q UPDATER_PUBLIC_KEY_NOT_CONFIGURED src-tauri/tauri.conf.json; then
            echo "::warning::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder: apps built from this tag will have self-update switched off."
          fi

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty (and unused) when the secret is absent.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "radarx desktop ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # latest.json (tauri-action's uploadUpdaterJson, on by default) is created from the signed
          # updater artifacts and merged across the jobs; the draft release must be published for
          # releases/latest/download/latest.json to resolve.
          args: --config ${{ matrix.config }} ${{ steps.sign.outputs.args }} --bundles ${{ matrix.bundles }}

      - name: Keep the installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  # ---------------------------------------------------------------------------------------------
  # The Python package for the command line: the wheel of python/ (`rxd`, `import rxd`, the
  # algorithms), attached to the draft release so it is uploaded to the download host with the
  # installers and covered by SHA256SUMS. It is not an app download and is not listed on the website.
  # ---------------------------------------------------------------------------------------------
  wheel:
    name: Python wheel (rxd)
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v') && needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the file to the draft release (nothing is pushed to the repository)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the wheel
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel ./python --no-deps -w dist
          ls -l dist
          wheel="$(ls dist/*.whl)"
          case "$wheel" in
            *-"${TAG#v}"-py3-none-any.whl) ;;
            *) echo "::error::$wheel does not carry the version of the tag $TAG (bump python/pyproject.toml)"; exit 1 ;;
          esac
          python - "$wheel" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          modules = [n for n in names if n.startswith("engine/builtin_modules/") and n.endswith(".py")]
          assert len(modules) >= 20, f"the algorithms are missing from the wheel ({len(modules)} files)"
          assert any(n.endswith("entry_points.txt") for n in names)
          print(f"{len(modules)} algorithm files in the wheel")
          PY

      - name: Attach it to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------------------------
  # The optional movie components (Playwright only; Chrome encodes the film, docs/BUNDLING.md): one zip per OS / architecture,
  # built with the SAME Python as the frozen engine (the pack holds a compiled extension built for that
  # Python; the engine refuses any other tag). Attached to the draft release next to the installers, so
  # the downloads job checksums and uploads them like everything else; build_index.py lists them under
  # `components`, never as app downloads. The installed app downloads one on request (with consent).
  # ---------------------------------------------------------------------------------------------
  movie-pack:
    name: Movie components (${{ matrix.name }})
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v') && needs.bundle.result == 'success'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # attach the files to the draft release (nothing is pushed to the repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: macOS x64
            os: macos-15-intel
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Must equal the python-version of the `bundle` job above (the frozen engine's Python).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the pack
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          python -m pip install --upgrade pip
          python scripts/release/build_movie_pack.py --out dist/movie-pack --version "${TAG#v}"
          ls -l dist/movie-pack

      - name: Keep the pack as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-pack-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: dist/movie-pack/*

      - name: Attach it to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/movie-pack/* --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------------------------
  # Download channel: upload the finished draft release to the download host as a candidate.
  # Writes only radarx/v<version>/ (never radarx/latest.json or radarx/releases.json: those belong to
  # promote-release.yml). Skips itself, successfully, on forks and wherever the R2 secrets are absent.
  # ---------------------------------------------------------------------------------------------
  downloads:
    name: Upload candidate to the download host
    needs: [bundle, wheel, movie-pack]
    if: startsWith(github.ref, 'refs/tags/v') && needs.bundle.result == 'success' && needs.wheel.result == 'success' && needs.movie-pack.result == 'success'
    runs-on: ubuntu-latest
    # Draft releases are only visible to a token with push access, so reading the draft needs
    # contents: write here (this job never writes to the repository).
    permissions:
      contents: write
    concurrency:
      group: downloads-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Are the download-host secrets set?
        id: gate
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Download host upload skipped: secret(s) not set:$missing. The draft GitHub release is unaffected. See docs/RELEASING.md."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      # The files the build jobs attached to the draft release (installers, .sig files, latest.json,
      # the wheel, the movie components packs with their .manifest.json sidecars).
      # `gh release download` finds drafts by tag on current gh versions; if it does not, look the
      # draft up in the release list and download its assets by id.
      - name: Download the draft release files
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir staging
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir staging --clobber; then
            echo "gh release download did not find the draft by tag; looking in the release list"
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
            if [ -z "$id" ]; then
              echo "::error::No GitHub release (draft or published) found for $TAG"
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --paginate \
              --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset_id asset_name; do
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "staging/$asset_name"
            done
          fi
          echo "Downloaded $(find staging -type f | wc -l) files:"
          ls -l staging

      # Validate the update manifest (signatures present, https, version = tag), point every url at
      # the download host, keep the signatures as they are, and write SHA256SUMS.
      - name: Prepare the candidate
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release/rewrite_latest.py --tag "$TAG" --dir staging

      # Upload under radarx/<tag>/ with the AWS CLI against R2's S3 endpoint, then read it back and
      # check every SHA-256. The access key reaches the CLI only through the environment.
      - name: Upload and verify the candidate
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          # R2 does not take the newer default checksum headers of the AWS CLI on every call.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          python scripts/release/upload_version.py --tag "$TAG" --dir staging
          python scripts/release/promote.py verify --tag "$TAG"
          {
            echo "### Candidate uploaded"
            echo ""
            echo "\`$TAG\` is on the download host but **not live**. Check it, then run the"
            echo "**Promote release** workflow with tag \`$TAG\` to publish it (docs/RELEASING.md)."
          } >> "$GITHUB_STEP_SUMMARY"
