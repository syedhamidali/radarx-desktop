name: Release

# Builds the installers (macOS Apple-silicon + Intel, Linux, Windows). Each one ships its own copy of
# the Python engine, so users install nothing else.
#   - push a tag like v0.2.0 to build and attach the installers to a draft GitHub release
#   - or run it by hand (Actions -> Release -> Run workflow) to just get the installers as artifacts
#
# Self-update (docs/UPDATES.md): when the repository secret TAURI_SIGNING_PRIVATE_KEY exists, tag and
# manual builds also create and sign the updater artifacts, and tauri-action publishes latest.json next
# to the installers. Without the secret (forks, or before the key is set up) and on pull requests the
# build is the same as before, just unsigned: it never fails because a secret is missing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Changes to the packaging itself get a trial build (no release is created).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "python/packaging/**"
      - "src-tauri/tauri.bundle*.json"

# Creating the GitHub release (and uploading the installers to it) needs write access to contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            config: src-tauri/tauri.bundle.macos.conf.json
            # "app" is what the updater downloads (.app.tar.gz); the dmg is the first-install download.
            bundles: app,dmg
            updater: true
          - name: macOS (Intel)
            os: macos-15-intel
            config: src-tauri/tauri.bundle.macos.conf.json
            bundles: app,dmg
            updater: true
          - name: Linux
            os: ubuntu-22.04
            config: src-tauri/tauri.bundle.conf.json
            bundles: deb,rpm
            # deb / rpm are not updater targets (tauri-bundler cannot sign them, and asking for updater
            # artifacts with only those targets is an error). Linux installs are told about new versions
            # and linked to the release page instead.
            updater: false
          - name: Windows
            os: windows-latest
            config: src-tauri/tauri.bundle.conf.json
            bundles: nsis
            updater: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # radarx (the optional algorithm modules) needs Python >= 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install engine dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[radarx,bundle,dev]"

      - name: Build the engine (PyInstaller) and smoke-test it
        working-directory: python
        run: python packaging/build_engine.py

      - name: Install frontend dependencies
        run: npm ci

      # Release notes shown in the app's update dialog come from the tag message
      # (git tag -a v0.3.0 -m "..."), because tauri-action copies the release body into latest.json.
      - name: Release notes from the tag message
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          body="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' | head -c 15000)"
          [ -n "$body" ] || body="See the release page for details."
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$body"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Sign the updater artifacts only when the private key is available (never on pull requests, and
      # not on forks, where secrets are empty). Secrets cannot be tested in `if:`, so test them here.
      - name: Decide whether to sign the updater artifacts
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          EVENT: ${{ github.event_name }}
          UPDATER: ${{ matrix.updater }}
        run: |
          if [ "$EVENT" != "pull_request" ] && [ "$UPDATER" = "true" ] && [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "Updater artifacts will be created and signed."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Updater artifacts are skipped (pull request, Linux package, or no TAURI_SIGNING_PRIVATE_KEY secret)."
            if [ "$EVENT" = "push" ] && [ "$UPDATER" = "true" ] && [ -z "$KEY" ]; then
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this release will have no latest.json and installed apps will not be offered updates. See docs/UPDATES.md."
            fi
          fi
          if [ "$EVENT" = "push" ] && grep -q UPDATER_PUBLIC_KEY_NOT_CONFIGURED src-tauri/tauri.conf.json; then
            echo "::warning::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder: apps built from this tag will have self-update switched off."
          fi

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty (and unused) when the secret is absent.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "radarx desktop ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # latest.json (tauri-action's uploadUpdaterJson, on by default) is created from the signed
          # updater artifacts and merged across the jobs; the draft release must be published for
          # releases/latest/download/latest.json to resolve.
          args: --config ${{ matrix.config }} ${{ steps.sign.outputs.args }} --bundles ${{ matrix.bundles }}

      - name: Keep the installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
