[project]
name = "radarx-desktop-engine"
version = "0.6.0"
description = "Python sidecar engine for radarx-desktop"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Radarx Desktop by LabShope Technologies" }]
dependencies = [
    # 0.13 reads every format through xd.open_datatree(path, engine=...), writes CfRadial1 with
    # renamed private helpers (engine/cfwrite.py uses them) and needs Python >= 3.12, which is
    # why this package needs it too.
    "xradar>=0.13.0",
    "xarray>=2026.4,<2027.0",
    # Plain dask only (xradar requires it anyway): [complete] would add distributed, bokeh, jinja2,
    # tornado, msgpack ... which the engine never imports.
    "dask>=2026.1,<2027.0",
    "websockets>=13.0,<17.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "pyproj>=3.6,<4.0",
    "boto3>=1.34,<2.0",
    "icechunk>=2.0,<3.0",
    "zarr>=2.18,<4.0",
    "pillow>=10.0,<14.0",
    "matplotlib>=3.8,<4.0",
    "colorcet>=3.0,<4.0",
    "cmweather>=0.3,<1.0",
    # The account gate (docs/ACCOUNTS.md): offline verification of the sign-in token's signature.
    "PyJWT>=2.8,<3.0",
    "cryptography>=42.0,<60",
]

[project.optional-dependencies]
# eccodes is in dev so the tests of the GRIB2 readers (HRRR, MRMS) run in CI.
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "open-radar-data", "eccodes>=2.38,<3.0"]
# Decoding GRIB2 messages (environment data from HRRR and MRMS): ecCodes from ECMWF, Apache-2.0, with its
# compiled library. Downloading and caching those messages needs nothing, only reading them does, so the
# default install and the installers stay small (engine/environment/gribio.py says how to get it).
grib = ["eccodes>=2.38,<3.0"]
# engine/arrow_bridge.py (xarray -> Arrow IPC). The app does not use it (the WebSocket sends raw
# binary chunks), so pyarrow (~55 MB unpacked) is neither installed by default nor bundled.
arrow = ["pyarrow>=15.0,<30.0"]
# The real CF Checker used by tests/test_output_standards.py (the tests skip without it). Needs the
# UDUNITS-2 library (brew install udunits / apt install libudunits2-dev) and the CF standard-name
# table (see docs/OUTPUT_STANDARDS.md), so it is not part of the lightweight dev extra.
cfcheck = ["cfchecker>=4.1", "cfunits>=3.3"]
# Building the self-contained engine shipped inside the installers (python/packaging/).
bundle = ["pyinstaller>=6.16"]
# `rxd animate` (docs/ANIMATE.md): Playwright drives the system Chrome that draws the frames and
# encodes the film with its own codecs. Neither package is needed to import or use the rest of the
# engine. PyAV is a fallback the user chooses (`--encoder pyav`, or automatically when Chrome cannot
# encode): its PyPI wheels bundle an FFmpeg built with GPL parts, so the project never ships it
# (not in the installers, not in the movie components pack); installing this extra is your choice.
video = ["playwright>=1.40,<2.0", "av>=12.0,<20.0"]
# The sign-in tokens go to the system credential store (Windows Credential Manager, macOS Keychain,
# Linux Secret Service) instead of a plain file (engine/account/credentials.py, docs/ACCOUNTS.md). The
# installers carry it; without it (a plain `pip install` of the engine) the tokens stay in a private file.
keyring = ["keyring>=25.0,<26"]
# Optional algorithm modules (modules/radarx_*.py). radarx needs Python >= 3.12, as this package does.
radarx = ["radarx>=0.5.1"]

# Command line: `rxd info FILE`, `rxd run radarx_hid FILE --all-sweeps` ... (docs/CLI.md).
# Also `python -m engine`. engine.cli imports the heavy engine lazily and is never imported by
# the sidecar server.
[project.scripts]
rxd = "engine.cli:main"
# Deprecated: the command was called `xrd` before; it still works (same program, plus a note in a terminal).
xrd = "engine.cli:main_xrd"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The packages are listed in setup.py: it adds python/modules/ (drop-in plugin files, loaded by path, not an
# importable package) to the wheel as the data folder engine/builtin_modules, see engine/plugins.py.
