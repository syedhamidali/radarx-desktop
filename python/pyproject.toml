[project]
name = "xradar-desktop-engine"
version = "0.1.0"
description = "Python sidecar engine for xradar-desktop"
requires-python = ">=3.10"
dependencies = [
    "xradar>=0.12,<1.0",
    "xarray>=2026.4,<2027.0",
    "dask[complete]>=2026.1,<2027.0",
    "datashader>=0.16,<1.0",
    "pycairo>=1.25,<2.0",
    "websockets>=13.0,<17.0",
    "pyarrow>=15.0,<30.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "pyproj>=3.6,<4.0",
    "boto3>=1.34,<2.0",
    "icechunk>=2.0,<3.0",
    "fsspec>=2024.1,<2027.0",
    "s3fs>=2024.1,<2027.0",
    "zarr>=2.18,<4.0",
    "pillow>=10.0,<14.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
# Building the self-contained engine shipped inside the installers (python/packaging/).
bundle = ["pyinstaller>=6.16"]
# Optional algorithm modules (modules/radarx_*.py). radarx itself needs Python >= 3.12.
radarx = ["radarx>=0.5.1; python_version >= '3.12'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# python/modules/ holds drop-in plugin files loaded by path, not an importable package
include = ["engine*"]
