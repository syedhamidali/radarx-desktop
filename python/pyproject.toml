[project]
name = "xradar-desktop-engine"
version = "0.1.0"
description = "Python sidecar engine for xradar-desktop"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Hamid Ali Syed" }]
dependencies = [
    "xradar>=0.12,<1.0",
    "xarray>=2026.4,<2027.0",
    # Plain dask only (xradar requires it anyway): [complete] would add distributed, bokeh, jinja2,
    # tornado, msgpack ... which the engine never imports.
    "dask>=2026.1,<2027.0",
    "websockets>=13.0,<17.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "pyproj>=3.6,<4.0",
    "boto3>=1.34,<2.0",
    "icechunk>=2.0,<3.0",
    "zarr>=2.18,<4.0",
    "pillow>=10.0,<14.0",
    "matplotlib>=3.8,<4.0",
    "colorcet>=3.0,<4.0",
    "cmweather>=0.3,<1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "open-radar-data"]
# engine/arrow_bridge.py (xarray -> Arrow IPC). The app does not use it (the WebSocket sends raw
# binary chunks), so pyarrow (~55 MB unpacked) is neither installed by default nor bundled.
arrow = ["pyarrow>=15.0,<30.0"]
# Building the self-contained engine shipped inside the installers (python/packaging/).
bundle = ["pyinstaller>=6.16"]
# Optional algorithm modules (modules/radarx_*.py). radarx itself needs Python >= 3.12.
radarx = ["radarx>=0.5.1; python_version >= '3.12'"]

# Command line: `xrd info FILE`, `xrd run radarx_hid FILE --all-sweeps` ... (docs/CLI.md).
# Also `python -m engine`. engine.cli imports the heavy engine lazily and is never imported by
# the sidecar server.
[project.scripts]
xrd = "engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# python/modules/ holds drop-in plugin files loaded by path, not an importable package.
# xrd/ is the short import alias of engine.api (`import xrd`).
include = ["engine*", "xrd*"]
