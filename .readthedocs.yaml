version: 2
build:
  os: "ubuntu-24.04"
  tools:
    python: "miniforge3-latest"
# Only sources are in the repository. Notebook outputs come from the "Docs" GitHub Actions workflow
# (orphan branch "docs-cache"); this build only executes notebooks whose code changed, see the
# nb_execution section of docs/conf.py.
conda:
  environment: environment.yml
sphinx:
  configuration: docs/conf.py
# autodoc imports the engine, and notebooks run in a separate kernel: install it, do not just
# put it on sys.path
python:
  install:
    - method: pip
      path: python
